{% set ui = display() %}
<!DOCTYPE html>
<html lang="en" data-theme="{{ 'dark' if ui.theme == 'dark' else 'light' }}" data-theme-setting="{{ ui.theme }}"{% if ui.font_scale != 100 %} style="font-size: {{ ui.font_scale }}%"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kash{% endblock %}</title>
  <script>
    (function () {
      const html = document.documentElement;
      if (html.dataset.themeSetting !== "system") return;
      const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      html.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="preload" href="/static/fonts/plus-jakarta-sans-latin.woff2?v=12" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ static_url("css/daisyui.min.css") }}">
  <link rel="stylesheet" href="{{ static_url("css/tailwind.min.css") }}">
  <link rel="stylesheet" href="{{ static_url("css/app.css") }}">
  {% include "components/pwa_head.html" %}
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex items-center justify-center px-4 py-10">
  <main class="w-full max-w-sm space-y-6">
    <div class="flex items-center justify-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-extrabold text-lg shadow-sm">K</div>
      <span class="text-2xl font-extrabold tracking-tight">Kash</span>
    </div>
    <div class="kash-card bg-white border border-slate-100 shadow-sm rounded-2xl p-6 space-y-5">
      {% if error %}
      <div role="alert" class="px-3.5 py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm font-medium">{{ error }}</div>
      {% endif %}
      {% block card %}{% endblock %}
    </div>
    <p class="text-center text-[0.6875rem] text-slate-400">Self-hosted personal finance</p>
  </main>
</body>
</html>
