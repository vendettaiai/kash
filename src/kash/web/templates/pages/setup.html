{% extends "auth_base.html" %}
{% block title %}Create your account - Kash{% endblock %}
{% block card %}
<div>
  <h1 class="text-lg font-bold text-slate-900">Create your account</h1>
  <p class="text-xs text-slate-500">This instance has no account yet. You become its owner and can invite others in your household from Settings.</p>
</div>
<form method="post" action="/setup" class="space-y-4">
  <label class="block">
    <span class="block text-xs font-semibold text-slate-700 mb-1">Your name</span>
    <input type="text" name="name" autocomplete="name" maxlength="100" required autofocus class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500" />
    <span class="block text-[0.6875rem] text-slate-400 mt-1">Shown in the greeting; you can change it in Settings.</span>
  </label>
  {% if needs_token %}
  <label class="block">
    <span class="block text-xs font-semibold text-slate-700 mb-1">Setup token</span>
    <input type="password" name="setup_token" autocomplete="off" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500" />
    <span class="block text-[0.6875rem] text-slate-400 mt-1">The <code>SETUP_TOKEN</code> value from this instance's <code>.env</code> file.</span>
  </label>
  {% endif %}
  <label class="block">
    <span class="block text-xs font-semibold text-slate-700 mb-1">Email</span>
    <input type="email" name="email" autocomplete="username" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500" />
  </label>
  <label class="block">
    <span class="block text-xs font-semibold text-slate-700 mb-1">Password</span>
    <input type="password" name="password" autocomplete="new-password" minlength="10" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500" />
    <span class="block text-[0.6875rem] text-slate-400 mt-1">At least 10 characters.</span>
  </label>
  <label class="block">
    <span class="block text-xs font-semibold text-slate-700 mb-1">Confirm password</span>
    <input type="password" name="confirm" autocomplete="new-password" minlength="10" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500" />
  </label>
  <button type="submit" class="w-full px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-xs transition-colors">Create account</button>
</form>
{% endblock %}
