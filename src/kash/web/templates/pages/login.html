{% extends "auth_base.html" %}
{% block title %}Log in - Kash{% endblock %}
{% block card %}
<div>
  <h1 class="text-lg font-bold text-slate-900">Log in</h1>
  <p class="text-xs text-slate-500">Welcome back.</p>
</div>
<form method="post" action="/login" class="space-y-4">
  <input type="hidden" name="next" value="{{ next }}" />
  <label class="block">
    <span class="block text-xs font-semibold text-slate-700 mb-1">Email</span>
    <input type="email" name="email" autocomplete="username" required autofocus class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500" />
  </label>
  <label class="block">
    <span class="block text-xs font-semibold text-slate-700 mb-1">Password</span>
    <input type="password" name="password" autocomplete="current-password" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500" />
  </label>
  <button type="submit" class="w-full px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-xs transition-colors">Log in</button>
</form>
{% endblock %}
